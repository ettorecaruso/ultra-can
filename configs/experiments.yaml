      lambda_mse: 2
      loss_weights:
        comm: 1.0
        sensing: 2
      sensing_range_penalty: 1.0
    data:
      num_symbols_train: 108
      num_symbols_val: 20
      num_symbols_test: 50
      snr_range: [0, 10]
      snr_step: 5
      echoes: [0, 1]
      max_delay: 5
    jamming:
      enable: true
      jamming_types: ["cw", "barrage", "partial_band"]
      jsr_range: [0, 5]
      jsr_step: 2
      n_realizations: 1
    experiments:
      jamming:
        jamming_types: ["cw", "barrage", "partial_band"]
        jsr_range: [0, 5]
        jsr_step: 2
        models: [conv1d, qkv, lstm, mc_dlsk]
        visualize_layers: false
    evaluation:
      snr_test_range: [0, 5, 10]
