frequency_agility:
  full:
    <<: *defaults
    general:
      experiment_name: "frequency_agility_full"
    channel:
      hold_mode: "per_hop"
    data:
      snr_range: [-5, 21]
      snr_step: 2
      echoes: [1, 3]
    frequency_hopping:
      enable: true
      num_channels: 8
      dwell_bursts: 1
      n_bursts_per_condition: 20000
      n_realizations: 5
      jammer_models: ["barrage", "fixed_partial", "sweep", "follower"]
      in_channel_types: ["cw", "partial_band"]
      jsr_values: [-10, -6, -2, 2, 6, 10]
      dwell_sweep: [1, 2, 4, 8, 16]
      dwell_sweep_jsr: 6.0
      dwell_sweep_models: ["sweep", "follower"]
