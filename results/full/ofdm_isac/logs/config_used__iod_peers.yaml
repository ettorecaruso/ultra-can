      ber_vs_snr:
        architectures:
        - conv1d
        - qkv
        - blind_stat
        scenarios:
        - echoes:
          - 1
          max_doppler: 8.0e-05
          name: k1_doppler_full
        - echoes:
          - 3
          max_doppler: 8.0e-05
          name: iod_peers
