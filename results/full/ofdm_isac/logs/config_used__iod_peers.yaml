      - 10
      jsr_step: 2
      n_realizations: 5
    model: &id006
      attention_dim: 64
      attention_heads: 8
      attention_mode: attention_pool
      attention_residual: true
      attention_temperature: 1.0
      backbone_type: conv1d
      communication_head:
        activation: relu
        modulation_order: 2
        units: 128
      conv_dilations:
      - 1
      - 1
      conv_filters:
      - 32
      - 64
      conv_kernel: 3
      conv_padding: same
      dropout_rate: 0.3
      pool_projection: true
      positional_encoding: true
      qkv_residual: true
      sensing_head:
        activation: relu
        delay_mode: regression
        output_activation: linear
        output_units: 33
        peak_sharpness: 8.0
        profile_max_lag: 33
        target: geometric_label
        units: 32
        use_delay_peak_feature: false
        use_max_pool_feature: true
        use_position_feature: false
        use_reference_profile: true
      size: full
    sweep_doppler: &id007
